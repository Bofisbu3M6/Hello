(--neon-cyan)}.dpi-box{background:rgba(0,255,255,0.05);border:1px dashed var(--neon-cyan);padding:15px;text-align:center;margin-top:20px;border-radius:10px}.dpi-text{color:var(--neon-cyan);font-weight:bold;font-size:18px}.fire-btn-text{color:#ff4d4d;font-weight:bold;text-align:center;margin-top:15px;font-size:15px;letter-spacing:1px}

</head>

    <div class="container">
        <div id="l-b">
            <h1>XÁC MINH</h1>
            <input type="password" id="p-i" placeholder="Mật khẩu...">
            <button class="btn-main" id="b-l">ĐĂNG NHẬP</button>
            <p id="e-m" style="color:red;font-size:12px;text-align:center;display:none">Sai mật khẩu!</p>
        </div>
        <div id="m-a" style="display:none">
            <h1>FIX LAG AUTO</h1>
            <div class="platform-selector">
                <button class="platform-btn active" id="btn-ios">IOS</button>
                <button class="platform-btn" id="btn-android">ANDROID</button>
            </div>
            <input type="text" id="d-n" placeholder="Tên dòng máy...">
            <button class="btn-main" id="g-s">LẤY ĐỘ NHẠY</button>
            <button class="btn-reset" id="r-s">RESET</button>
            <div class="results" id="res">
                <div class="sensi-item"><div class="sensi-info"><div>Nhìn Xung Quanh</div><div id="v1">0</div></div><div class="progress-bar"><div class="progress-fill" id="b1"></div></div></div>
                <div class="sensi-item"><div class="sensi-info"><div>Hồng Tâm</div><div id="v2">0</div></div><div class="progress-bar"><div class="progress-fill" id="b2"></div></div></div>
                <div class="sensi-item"><div class="sensi-info"><div>Ống Ngắm X2</div><div id="v3">0</div></div><div class="progress-bar"><div class="progress-fill" id="b3"></div></div></div>
                <div class="sensi-item"><div class="sensi-info"><div>Ống Ngắm X4</div><div id="v4">0</div></div><div class="progress-bar"><div class="progress-fill" id="b4"></div></div></div>
                <div class="sensi-item"><div class="sensi-info"><div>Súng Ngắm</div><div id="v5">0</div></div><div class="progress-bar"><div class="progress-fill" id="b5"></div></div></div>
                <div class="sensi-item"><div class="sensi-info"><div>Camera</div><div id="v6">0</div></div><div class="progress-bar"><div class="progress-fill" id="b6"></div></div></div>
                <div class="fire-btn-text">NÚT BẮN: <span id="f-v">31</span>%</div>
                <div class="dpi-box"><div style="font-size:10px;color:#888">DPI</div><div class="dpi-text" id="d-v">0</div></div>
            </div>
        </div>
    </div>
